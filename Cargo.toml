[package]
name = "bevy_ios_toolkit"
version = "0.9.0"
edition = "2024"
license = "MIT"
description = "Native iOS integrations for Bevy as ECS resources and messages: StoreKit IAP, Google AdMob ads, App Tracking Transparency, Game Center, review prompts, haptics and safe-area — each behind a feature and a polled C-ABI Swift bridge, with desktop fakes only where useful."
repository = "https://github.com/marmikshah/bevy_ios_toolkit"
keywords = ["bevy", "ios", "storekit", "admob", "gamekit"]
categories = ["game-development", "api-bindings"]
# Rust sources only: the Swift half ships through SPM from this repository.
include = ["src/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE"]

[workspace]
# The root package is a member implicitly; listing "." would also claim the
# excluded demo. `save/` is the std-only `game_save` crate, consumed by Git
# revision. The demo keeps its own manifest and lockfile.
members = ["save"]
exclude = ["demo"]

[dependencies]
# Minimal: the bridge is pure data + ECS plumbing, no render/UI surface.
bevy = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Logging only (Bevy's LogPlugin collects it); already in Bevy's graph.
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[features]
# No integration is on by default: a module's `extern "C"` block needs its SPM
# product linked into the app, or iOS linking fails on undefined symbols.
default = []
storekit = ["dep:serde", "dep:serde_json"]
ads = ["dep:serde", "dep:serde_json", "dep:tracing", "att", "bevy/bevy_window"]
platform = ["bevy/bevy_window"]
# `platform::boot_shield::BootShieldPlugin`: render-world systems that paint
# unwritten launch drawables and lower the shield after real presents. Pulls in
# Bevy's renderer, which a game with DefaultPlugins already builds.
boot-shield = ["platform", "dep:tracing", "bevy/bevy_render"]
# `capture`: desktop offscreen-render helpers. `WinitPlugin` is named so it can
# be disabled; `x11` is the backend winit needs to compile on Linux.
capture = ["bevy/bevy_render", "bevy/bevy_winit", "bevy/x11"]
att = []
gamekit = []
review = []
notifications = ["dep:serde", "dep:serde_json"]
game = ["platform", "storekit", "ads", "notifications"]
all = ["storekit", "ads", "platform", "att", "gamekit", "review", "notifications"]

[[example]]
name = "ads"
required-features = ["ads"]

[package.metadata.docs.rs]
all-features = true

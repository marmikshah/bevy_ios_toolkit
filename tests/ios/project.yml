name: ToolkitStoreTests
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  BevyIosToolkit:
    path: ../..
targets:
  StoreTestHost:
    type: application
    platform: iOS
    sources:
      - path: StoreTestApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marmikshah.toolkit.store-tests
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: BevyIosToolkit
        product: Store
  ToolkitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StoreKitTests.swift
      - path: Toolkit.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marmikshah.toolkit.store-tests.uitests
        TEST_TARGET_NAME: StoreTestHost
    dependencies:
      - target: StoreTestHost
schemes:
  ToolkitStoreTests:
    build:
      targets:
        StoreTestHost: all
        ToolkitUITests: [test]
    test:
      config: Debug
      targets:
        - ToolkitUITests
